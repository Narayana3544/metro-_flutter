name: Flutter APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Environment
        run: |
          java -version
          flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK to Original App Name
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/metro_flutter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metro_flutter
          path: build/app/outputs/flutter-apk/metro_flutter.apk
          retention-days: 14